[project]
name = "holos-tts-fastapi"
version = "0.1.0"
description = "OpenAI-compatible speech synthesis API server for the HolosTTS Ukrainian TTS model"
readme = "README.md"
authors = [
    { name = "MaksymHalych", email = "galych0222@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "numpy>=1.26",
    "scipy>=1.13",
    "soundfile>=0.12",
    "librosa>=0.10",
    "transformers>=4.44",
    "huggingface-hub>=0.24",
    "torch>=2.3",
    "torchaudio>=2.3",
    "ipa-uk",
    "ukrainian-word-stress",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
torchaudio = [{ index = "pytorch-cpu" }]
ipa-uk = { git = "https://github.com/patriotyk/ipa-uk.git", rev = "3faf05ec50fd4880965b6c76f8e479a4f82117f5" }
ukrainian-word-stress = { git = "https://github.com/patriotyk/ukrainian-word-stress.git", rev = "d5b37ea0abe9711930d9c3b0b13edec5a0675512" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"
